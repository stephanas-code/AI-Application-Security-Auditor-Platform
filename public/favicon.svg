<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="50%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- Shield Crimson Gradient -->
    <linearGradient id="shieldCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Cyber Cyan Accent Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#22222E" stroke-width="2"/>

  <!-- Shield Outer Geometry -->
  <path d="M 64,18 
           L 100,32 
           C 100,68 85,96 64,110 
           C 43,96 28,68 28,32 
           Z" 
        fill="url(#shieldCrimson)" 
        opacity="0.18"/>

  <!-- Shield Core Border Contour -->
  <path d="M 64,22 
           L 96,35 
           C 96,68 82,92 64,105 
           C 46,92 32,68 32,35 
           Z" 
        fill="none" 
        stroke="url(#shieldCrimson)" 
        stroke-width="3.5"
        stroke-linejoin="round"/>

  <!-- Inner Cyber Wings ("M" & "S" Crest Geometry) -->
  <!-- Left Wing (Letter M facet) -->
  <path d="M 42,42 
           L 54,42 
           L 64,62 
           L 56,76 
           L 46,58 
           L 46,84 
           L 38,84 
           Z" 
        fill="url(#cyberCyan)" 
        filter="url(#neonGlow)"/>

  <!-- Right Wing (Letter S facet & Shield Apex) -->
  <path d="M 86,44 
           L 66,44 
           L 60,54 
           L 74,54 
           C 80,54 84,57 84,63 
           C 84,70 78,74 70,74 
           L 62,74 
           L 62,84 
           L 72,84 
           C 84,84 92,76 92,64 
           C 92,52 86,46 86,44 
           Z" 
        fill="#FFFFFF"/>

  <!-- Diagonal Core Energy Bolt Connecting M and S -->
  <polygon points="64,30 68,52 61,52 65,70 57,55 63,55" fill="#FF3B30" filter="url(#neonGlow)"/>

  <!-- Cyber Node Sparkles -->
  <circle cx="64" cy="22" r="3" fill="#38BDF8"/>
  <circle cx="64" cy="105" r="2.5" fill="#FF3B30"/>
</svg>